<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Domain gesichert</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --border: #2a2a3a;
      --accent: #c8f55a;
      --accent-dim: rgba(200, 245, 90, 0.12);
      --text: #e8e8f0;
      --muted: #5a5a72;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Subtle grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 60px 60px;
      opacity: 0.35;
      pointer-events: none;
    }

    /* Glow orb */
    body::after {
      content: '';
      position: fixed;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(200,245,90,0.07) 0%, transparent 70%);
      pointer-events: none;
    }

    .card {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 56px 64px;
      max-width: 560px;
      width: 90%;
      animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    /* Corner accents */
    .card::before, .card::after {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      border-color: var(--accent);
      border-style: solid;
    }
    .card::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
    .card::after  { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent);
      background: var(--accent-dim);
      border: 1px solid rgba(200,245,90,0.25);
      padding: 5px 12px;
      margin-bottom: 32px;
      animation: fadeUp 0.8s 0.1s cubic-bezier(0.16,1,0.3,1) both;
    }

    .badge::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 2s infinite;
    }

    h1 {
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: clamp(2rem, 5vw, 2.75rem);
      font-weight: 400;
      line-height: 1.15;
      color: var(--text);
      margin-bottom: 20px;
      animation: fadeUp 0.8s 0.2s cubic-bezier(0.16,1,0.3,1) both;
    }

    h1 em {
      font-style: italic;
      color: var(--accent);
    }

    p {
      font-size: 13px;
      line-height: 1.8;
      color: var(--muted);
      letter-spacing: 0.02em;
      animation: fadeUp 0.8s 0.3s cubic-bezier(0.16,1,0.3,1) both;
    }

    .divider {
      width: 40px;
      height: 1px;
      background: var(--border);
      margin: 28px 0;
      animation: fadeUp 0.8s 0.35s cubic-bezier(0.16,1,0.3,1) both;
    }

    .meta {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.08em;
      animation: fadeUp 0.8s 0.4s cubic-bezier(0.16,1,0.3,1) both;
    }

    .meta span { opacity: 0.4; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Status: Aktiv</div>
    <h1>Diese Domain wurde <em>gesichert</em></h1>
    <p>
      Diese Domain ist reserviert und wird geschützt aufbewahrt.
      Für weitere Informationen wenden Sie sich bitte an den zuständigen Administrator.
    </p>
    <div class="divider"></div>
    <div class="meta">
      <span>©&nbsp;2026</span>
      <span>·</span>
      <span>Alle Rechte vorbehalten</span>
    </div>
  </div>
</body>
</html>
